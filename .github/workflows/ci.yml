name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          ADMIN_TOKEN=browser-test-token npm start > /tmp/tech-explorer.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/products && break || sleep 1; done
          node tests/browser.cjs
