<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Khám phá cấu tạo phần cứng</title>
  <desc id="desc">Minh họa chip xử lý phát sáng ở trung tâm với các biểu tượng linh kiện xung quanh</desc>
  <defs>
