      <stop offset="0" stop-color="#061421"/>
      <stop offset=".52" stop-color="#082438"/>
      <stop offset="1" stop-color="#04101b"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21ddff"/>
      <stop offset=".45" stop-color="#0a88b7"/>
      <stop offset="1" stop-color="#07385c"/>
